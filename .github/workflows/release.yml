name: Release

# Pushing a tag vX.Y.Z (matching package.json) builds the extension once, then publishes that
# exact .vsix to GitHub Releases, the VS Code Marketplace (VSCE_PAT) and Open VSX (OVSX_PAT).
# Tags with a suffix (v1.2.3-rc.1) only create a GitHub pre-release.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "${tag%%-*}" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - run: npm run lint
      - run: npm run check:grammars
      - run: npm run compile
      - run: npm run test:unit
      - run: npm run test:grammar
      - run: xvfb-run -a npm run test:integration
      - run: npx vsce package --out rego-syntax-support-${{ steps.version.outputs.version }}.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.build.outputs.version }}
          files: '*.vsix'
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  publish-marketplace:
    name: Publish to the VS Code Marketplace
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - run: npx vsce publish --packagePath rego-syntax-support-${{ needs.build.outputs.version }}.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-open-vsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - run: npx --yes ovsx@1.3.0 publish rego-syntax-support-${{ needs.build.outputs.version }}.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
