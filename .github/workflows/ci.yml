name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with scripts/grammar/opa-builtins.json (`npm run update:builtins`).
  OPA_VERSION: 1.22.0

jobs:
  checks:
    name: Lint, unit and grammar tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Generated grammars are up to date
        run: npm run check:grammars
      - name: Compile
        run: npm run compile
      - name: Unit tests
        run: npm run test:unit
      - name: Grammar assertion tests
        run: npm run test:grammar

  opa:
    name: Rego files are accepted by OPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Expand the snippets (written to out/snippets-check)
        run: npm run compile && npm run test:unit
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ env.OPA_VERSION }}
      - name: opa parse
        run: |
          opa version
          status=0
          for file in test/fixtures/*.rego test/integration/*.rego out/snippets-check/*.rego; do
            if opa parse "$file" > /dev/null; then
              echo "ok      $file"
            else
              echo "::error file=$file::opa parse failed"
              status=1
            fi
          done
          exit $status
      - name: Built-ins match the OPA binary
        run: |
          opa capabilities --current \
            | jq -r '.builtins[] | select(.infix == null) | .name | select(startswith("internal.") | not)' \
            | sort > /tmp/opa-builtins.txt
          jq -r '.builtins[].name' scripts/grammar/opa-builtins.json | sort > /tmp/grammar-builtins.txt
          diff -u /tmp/opa-builtins.txt /tmp/grammar-builtins.txt

  integration:
    name: VS Code ${{ matrix.vscode }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: [stable]
        include:
          # Oldest version allowed by engines.vscode in package.json.
          - os: ubuntu-latest
            vscode: 1.85.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run test:integration
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [checks, opa, integration]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: rego-syntax-support-vsix
          path: '*.vsix'
          retention-days: 30
